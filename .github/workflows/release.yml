name: Publish private release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
      - run: python scripts/fabrica.py package
      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/sha256.json --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
