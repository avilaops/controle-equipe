name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
      - run: python scripts/fabrica.py validate
      - run: python scripts/fabrica.py package
      - uses: actions/upload-artifact@v7
        with:
          name: avilaops-plugin-packages
          path: dist/
          if-no-files-found: error
          retention-days: 30
